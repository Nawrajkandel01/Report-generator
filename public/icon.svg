<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Solid Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Document Frame with subtle border -->
  <rect x="96" y="76" width="320" height="360" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#glow)" />

  <!-- Top Fold Accent / Header Line -->
  <rect x="136" y="116" width="160" height="18" rx="9" fill="url(#blueGrad)" />
  <rect x="136" y="146" width="90" height="12" rx="6" fill="#64748b" />

  <!-- Document Camera & Photo Viewfinder Symbol -->
  <rect x="136" y="184" width="240" height="170" rx="24" fill="#0f172a" stroke="#3b82f6" stroke-width="6" />

  <!-- Camera Top Notch -->
  <path d="M 220 184 L 232 168 L 280 168 L 292 184 Z" fill="url(#blueGrad)" />

  <!-- Lens Outer Circle -->
  <circle cx="256" cy="269" r="48" fill="#1e293b" stroke="url(#blueGrad)" stroke-width="8" />

  <!-- Lens Inner Circle & Glass Glare -->
  <circle cx="256" cy="269" r="28" fill="#0284c7" />
  <circle cx="246" cy="259" r="10" fill="#ffffff" opacity="0.85" />

  <!-- Flash LED -->
  <circle cx="336" cy="216" r="10" fill="#fbbf24" />

  <!-- Bottom Report Checkmark / Summary Lines -->
  <rect x="136" y="380" width="180" height="14" rx="7" fill="#475569" />
  <rect x="136" y="404" width="120" height="10" rx="5" fill="#334155" />

  <!-- Status indicator dot -->
  <circle cx="356" cy="387" r="12" fill="#10b981" />
  <path d="M 351 387 L 354 390 L 361 383" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
